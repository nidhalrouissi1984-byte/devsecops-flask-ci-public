version: 0.2

env:
  shell: bash
  variables:
    # A adapter a votre compte AWS
    ECR_REPOSITORY: "devsecops-flask-nidhal"
    ECS_CLUSTER: "devsecops-flask-task"
    ECS_SERVICE: "devsecops-flask-task-service-zap5h4zm"
    # v0.69.3 : derniere version saine connue (v0.69.4 etait compromise)
    TRIVY_VERSION: "0.69.3"
    TRIVY_SHA256: "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - python -m pip install --upgrade pip
      - pip install -r requirements.txt
      - pip install pytest pytest-cov pip-audit
      - curl -fsSL -o /tmp/sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
      - unzip -q /tmp/sonar-scanner.zip -d /opt
      - curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
      - tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz
      - echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
      - tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
      - gitleaks version
      - trivy --version

  pre_build:
    commands:
      - |
        set -euo pipefail

        SECRET_JSON="$(aws secretsmanager get-secret-value \
          --secret-id sonarcloud/token \
          --query SecretString \
          --output text)"

        export SONAR_TOKEN="$(python -c '
        import json, sys
        s = sys.stdin.read().strip()
        try:
            d = json.loads(s)
        except json.JSONDecodeError:
            d = s

        if isinstance(d, dict):
            token = d.get("SONAR_TOKEN") or d.get("token")
            if not token and len(d) == 1:
                token = next(iter(d.values()))
        else:
            token = d

        if not isinstance(token, str) or not token.strip():
            sys.exit("SonarCloud token missing or invalid")
        print(token.strip())
        ' <<< "$SECRET_JSON")"

        test -n "$SONAR_TOKEN"
        echo "SonarCloud token retrieved successfully"
      - |
        set -euo pipefail
        export AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
        export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
        export IMAGE_TAG="$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}" | cut -c 1-7)"
        export IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
        aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
          | docker login --username AWS --password-stdin "$ECR_REGISTRY"
        echo "Image cible : $IMAGE_URI"

  build:
    on-failure: ABORT
    commands:
      # 1. Secrets
      - gitleaks detect --source . --no-git --verbose --redact
      # 2. SCA : dependances Python
      - pip-audit -r requirements.lock --require-hashes --desc
      # 3. Tests + couverture
      - python -m py_compile app.py
      - python -m pytest -v --cov=. --cov-report=xml
      # 4. SAST : SonarCloud
      - export PATH="/opt/sonar-scanner-6.2.1.4610-linux-x64/bin:$PATH"
      - |
        sonar-scanner \
          -Dsonar.organization=nidhalrouissi1984-byte \
          -Dsonar.projectKey=nidhalrouissi1984-byte_devsecops-flask-ci-public \
          -Dsonar.sources=. \
          -Dsonar.tests=tests \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.token="$SONAR_TOKEN" \
          -Dsonar.python.coverage.reportPaths=coverage.xml \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.exclusions="**/test_*.py,**/__pycache__/**,.venv/**,venv/**"
      # 5. Construction de l'image Docker
      - docker build -t "$IMAGE_URI" -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" .
      # 6. SCA : scan de l'image (OS + librairies), bloque sur HIGH/CRITICAL
      - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress "$IMAGE_URI"

  post_build:
    commands:
      # 7. Push vers ECR
      - docker push "$IMAGE_URI"
      - docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
      - echo "Image $IMAGE_URI poussee dans ECR"
      # Diagnostic : affiche ce que CodeBuild voit dans ECS
      - echo "Region=$AWS_DEFAULT_REGION Cluster=$ECS_CLUSTER Service=$ECS_SERVICE"
      - aws ecs list-clusters --output text || true
      - aws ecs list-services --cluster "$ECS_CLUSTER" --output text || true
      # 8. Deploiement sur ECS : relance les taches avec la nouvelle image :latest
      - aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment --query "service.serviceName" --output text
      # 9. Attend que les nouvelles taches soient en bonne sante (echoue sinon)
      - aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
      - echo "Deploiement ECS termine"
      # 10. DAST (CD) : OWASP ZAP attaque l'application deployee sur ECS
      - |
        set -uo pipefail
        echo "ETAPE ZAP 1/4 : recherche de la tache ECS"
        TASK_ARN="$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --service-name "$ECS_SERVICE" --desired-status RUNNING --query 'taskArns[0]' --output text)" \
          || { echo "ECHEC ZAP 1 : droit ecs:ListTasks manquant ?"; exit 1; }
        echo "Tache : $TASK_ARN"
        echo "ETAPE ZAP 2/4 : recherche de l'interface reseau"
        ENI_ID="$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" --output text)" \
          || { echo "ECHEC ZAP 2 : droit ecs:DescribeTasks manquant ?"; exit 1; }
        echo "Interface : $ENI_ID"
        echo "ETAPE ZAP 3/4 : recherche de l'IP publique"
        APP_IP="$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI_ID" --query 'NetworkInterfaces[0].Association.PublicIp' --output text)" \
          || { echo "ECHEC ZAP 3 : droit ec2:DescribeNetworkInterfaces manquant ?"; exit 1; }
        if [ -z "$APP_IP" ] || [ "$APP_IP" = "None" ]; then
          echo "ECHEC ZAP 3 : la tache n'a pas d'IP publique (activer Public IP dans le service)"; exit 1
        fi
        echo "Application deployee : http://${APP_IP}:5000"
        echo "ETAPE ZAP 4/4 : scan OWASP ZAP"
        mkdir -p zap && chmod 777 zap
        docker run --rm -v "$(pwd)/zap:/zap/wrk:rw" \
          ghcr.io/zaproxy/zaproxy:stable \
          zap-baseline.py -t "http://${APP_IP}:5000" -r zap-report.html -I
        ZAP_CODE=$?
        echo "Code de sortie ZAP : $ZAP_CODE (0 = OK, 1 = alerte FAIL, 3 = application injoignable : verifier le security group)"
        exit $ZAP_CODE

artifacts:
  files:
    - zap/zap-report.html
