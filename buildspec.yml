
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo "Running functional tests"

  build:
    commands:
      - python -m compileall -q app.py
      - python -m pytest -v

  post_build:
    commands:
      - echo "Functional tests completed successfully"
